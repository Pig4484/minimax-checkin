[project]
name = "minimax-checkin"
version = "1.0.0"
description = "MiniMax Agent 每日自動簽到工具（Fluent Design GUI，風格參考 Ghost Downloader）"
requires-python = ">=3.10"
dependencies = [
    "PySide6==6.11.2",
    "PySide6-Fluent-Widgets==1.11.3",
    "playwright==1.63.0",
    "loguru>=0.7.2",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
